[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "evaldenom"
version = "0.1.0"
description = "Offline intended-coverage and identity preflight for evaluation exports"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []
[project.scripts]
evaldenom = "evaldenom.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
