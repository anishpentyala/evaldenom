[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "evaldenom"
version = "0.1.0"
readme = "README.md"
authors = [{name = "Anish Pentyala"}]
keywords = ["evaluation", "data-validation", "machine-learning"]
description = "Offline intended-coverage and identity preflight for evaluation exports"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []
[project.urls]
Homepage = "https://github.com/anishpentyala/evaldenom"
Repository = "https://github.com/anishpentyala/evaldenom"
Issues = "https://github.com/anishpentyala/evaldenom/issues"

[project.scripts]
evaldenom = "evaldenom.cli:cli"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
