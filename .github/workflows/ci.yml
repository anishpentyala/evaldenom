name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ${{ matrix.python == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install from source
        run: python -m pip install . pytest
      - name: Run full contract suite
        run: python -m pytest -q
      - name: Exercise installed CLI outside source tree
        shell: bash
        run: |
          source_dir="$PWD"
          cd "$(mktemp -d)"
          evaldenom freeze "$source_dir/examples/cases.jsonl" --metrics "$source_dir/examples/metrics.json" --output manifest.json
          evaldenom audit manifest.json --run "baseline=$source_dir/examples/baseline.jsonl" --run "candidate=$source_dir/examples/candidate-complete.jsonl" --output ready.json
          set +e
          evaldenom audit manifest.json --run "baseline=$source_dir/examples/baseline.jsonl" --run "candidate=$source_dir/examples/candidate-missing.jsonl" --output blocked.json
          blocked_status=$?
          evaldenom audit manifest.json --run "baseline=$source_dir/examples/baseline.jsonl" > invalid.out 2> invalid.err
          invalid_status=$?
          set -e
          test "$blocked_status" -eq 1
          test "$invalid_status" -eq 2
          test ! -s invalid.out
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('ready.json').read_text())['status'] == 'READY'
          blocked = json.loads(Path('blocked.json').read_text())
          assert blocked['status'] == 'BLOCKED'
          assert blocked['runs']['candidate']['findings'] == [
              {'code': 'MISSING_OBSERVATION', 'id': 'hard', 'trial': 1},
              {'code': 'MISSING_OBSERVATION', 'id': 'hard', 'trial': 2},
          ]
          PY
      - name: Exercise installed Promptfoo CLI outside source tree
        env:
          SOURCE_DIR: ${{ github.workspace }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile

          source = Path(os.environ['SOURCE_DIR']).resolve()
          fixtures = source / 'tests' / 'fixtures' / 'promptfoo'
          with tempfile.TemporaryDirectory() as working:
              def cli(*args):
                  return subprocess.run(['evaldenom', *map(str, args)], cwd=working,
                                        capture_output=True, text=True)
              root = Path(working)
              manifest = root / 'manifest.json'
              frozen = cli('promptfoo-freeze', fixtures / 'prospective-tests.json',
                           '--grader', 'local-equals-v1', '--output', manifest)
              assert frozen.returncode == 0, frozen.stderr
              selections = root / 'selections.json'
              selections.write_text(json.dumps({
                  label: {'provider_id': 'local-synthetic-' + label, 'prompt_index': 0,
                          'grader': 'local-equals-v1'}
                  for label in ('baseline', 'candidate')
              }), encoding='utf-8')
              runs = {}
              for label in ('baseline', 'candidate'):
                  path = root / (label + '.json')
                  path.write_bytes((fixtures / ('real-' + label + '-export.json')).read_bytes())
                  runs[label] = path
              args = ['promptfoo-audit', manifest, '--selections', selections]
              for label, path in runs.items():
                  args.extend(['--run', label + '=' + str(path)])
              ready = cli(*args)
              assert ready.returncode == 0, ready.stderr
              assert json.loads(ready.stdout)['status'] == 'READY'
              for path in runs.values():
                  data = json.loads(path.read_text(encoding='utf-8'))
                  data['results']['results'] = [r for r in data['results']['results']
                      if r['testCase']['metadata']['external_case_id'] != 'hard']
                  path.write_text(json.dumps(data), encoding='utf-8')
              blocked = cli(*args)
              assert blocked.returncode == 1, blocked.stderr
              report = json.loads(blocked.stdout)
              assert report['status'] == 'BLOCKED'
              for run in report['runs'].values():
                  assert run['findings'] == [
                      {'code': 'MISSING_OBSERVATION', 'id': 'hard', 'trial': 1},
                      {'code': 'MISSING_OBSERVATION', 'id': 'hard', 'trial': 2},
                  ]
              selections.write_text('{"a":1,"a":2}', encoding='utf-8')
              output = root / 'report.json'
              output.write_text('KEEP', encoding='utf-8')
              invalid = cli(*args, '--output', output)
              assert invalid.returncode == 2 and invalid.stdout == ''
              assert output.read_text(encoding='utf-8') == 'KEEP'
              print('Installed Promptfoo CLI outside checkout: READY=0, shared omission=1, invalid=2; output preserved')
          PY
